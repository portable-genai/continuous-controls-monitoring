# Automated dependency updates for every ecosystem this repo actually pins.
#
# Pairs with the committed lockfiles (requirements-*.lock), the digest-pinned base image
# (Dockerfile) and the SHA-pinned GitHub Actions: dependabot proposes the bumps, and the hard
# gate plus its pip-audit job decide. An ecosystem missing here is a pin nobody is watching.
#
# Cadence is deliberate, not inherited: pip is DAILY because the Python surface is where the
# catalog's vulnerabilities land and a lockfile only helps if it moves; images and Actions are
# weekly because they change slowly and each bump costs a review.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

